name: Daily Data Sync

# ONE daily workflow that owns the whole data path for every league. It replaces
# five separate workflows (nightly-pipeline, mlb-nightly-pipeline,
# espn-nightly-ingest, reconcile-picks, mlb-reconcile-picks — now manual-only).
#
# Schedule: 11:00 UTC (07:00 ET). The last US game of the previous night (west
# coast MLB / NBA, incl. extra innings) is final by ~07:00 UTC; Monday-night NFL
# ends ~04:30 UTC. ESPN and statsapi.mlb.com are not IP-blocked from Actions.
#
# Job "data"  : ingest NFL, NHL, MLB, NBA -> reconcile yesterday's picks (inside
#               the NBA / MLB batches) -> trends -> read-only FRESHNESS CHECK.
#               Each league's steps run independently (a failed NFL ingest does
#               not skip NBA); the job still ends red so the failure is visible.
# Job "picks" : MLB + NBA pick generation, needs "data", continue-on-error, so a
#               Kalshi outage can never fail the data sync. It only runs a
#               league's picks when that league's core data steps succeeded.
#
# MLB Kalshi markets open PER-GAME ~1h before first pitch, so at 11:00 UTC only
# early games have markets. The hourly mlb-selfheal-picks.yml (picks only, same
# 'mlb-nightly' concurrency group) adds the rest additively as they list.
#
# Manual: run any single league via the `league` input; `force` rebuilds today's
# ungraded MLB picks (--force); start/end date override the NFL/NHL window.
on:
  schedule:
    # West-coast NBA games finish ~05:00 UTC. GitHub delays/skips scheduled runs
    # under load (11:00 once ran at 16:09), so several idempotent passes keep
    # last night's box scores landing by morning ET regardless of one slow run.
    - cron: '0 4 * * *'
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      league:
        description: 'League to run (all = every league)'
        type: choice
        options: [all, nba, mlb, nfl, nhl]
        default: all
      force:
        description: 'Rebuild today''s ungraded MLB picks (--force)'
        type: boolean
        default: false
      start_date:
        description: 'NFL/NHL start date override (YYYY-MM-DD); default = 3 days ago'
        type: string
        required: false
      end_date:
        description: 'NFL/NHL end date override (YYYY-MM-DD); default = today'
        type: string
        required: false

jobs:
  data:
    name: Ingest + reconcile + trends + freshness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Same group as mlb-selfheal-picks.yml: both write pick_results / MLB tables.
    concurrency:
      group: mlb-nightly
      cancel-in-progress: false
    outputs:
      nba_ok: ${{ steps.gate.outputs.nba_ok }}
      mlb_ok: ${{ steps.gate.outputs.mlb_ok }}

    env:
      LEAGUE: ${{ github.event.inputs.league || 'all' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_PRIVATE_KEY_PATH: ./kalshi_key.pem
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r analytics/requirements.txt
          npm ci --prefix server

      - name: Write Kalshi PEM key
        run: printf '%s' "$KEY" > server/kalshi_key.pem
        env:
          KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}

      # ── NFL / NHL (ESPN) — re-ingests the last 3 days (idempotent upserts) ──
      - name: Ingest NFL
        id: nfl
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'nfl') }}
        env:
          START: ${{ github.event.inputs.start_date }}
          END: ${{ github.event.inputs.end_date }}
        run: |
          START="${START:-$(date -u -d '3 days ago' +%F)}"
          END="${END:-$(date -u +%F)}"
          python -m analytics.batch.nfl_init --rosters --start-date "$START" --end-date "$END"

      - name: Ingest NHL
        id: nhl
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'nhl') }}
        env:
          START: ${{ github.event.inputs.start_date }}
          END: ${{ github.event.inputs.end_date }}
        run: |
          START="${START:-$(date -u -d '3 days ago' +%F)}"
          END="${END:-$(date -u +%F)}"
          python -m analytics.batch.nhl_init --rosters --start-date "$START" --end-date "$END"

      # ── MLB ──
      # Refresh teams + active rosters (idempotent upserts; picks up call-ups).
      - name: Refresh MLB rosters
        id: mlb_init
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'mlb') }}
        run: python -m analytics.batch.mlb_init

      # Reconcile yesterday's picks, backfill missed box scores, sync today's
      # slate + probable starters, compute daily_conditions.
      - name: MLB nightly batch (incl. reconcile)
        id: mlb_nightly
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'mlb') }}
        run: python -m analytics.batch.mlb_nightly --today

      # Empirical park factors + pitcher quality snapshots.
      - name: MLB enrich
        id: mlb_enrich
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'mlb') }}
        run: python -m analytics.batch.mlb_enrich

      - name: Compute MLB trends
        id: mlb_trends
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'mlb') }}
        working-directory: server
        run: npm run sync-data-mlb

      # ── NBA (ESPN-only) ──
      # Backfill missed dates + today's box scores + reconcile yesterday's picks
      # + derive player_game_conditions + compute today's daily_conditions.
      # Link existing players to ESPN ids, then create rows for athletes on a
      # current ESPN roster that we don't have (rookies, signings, two-ways) so
      # their box scores aren't skipped. No-op when nothing changed.
      - name: NBA roster sync (new players)
        id: nba_roster
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'nba') }}
        run: |
          python -m analytics.batch.map_espn_ids --players
          python -m analytics.batch.seed_nba_players

      # Trades / signings / waivers: re-point players.team at each league's
      # current rosters (NBA had no other step that ever updated team). Runs
      # after NBA seeding and before the nightly batch, whose context buckets
      # read players.team. Fails only when a roster fetch looks broken.
      - name: Sync rosters (trades) — all leagues
        id: rosters
        if: ${{ !cancelled() }}
        run: |
          if [ "$LEAGUE" = "all" ]; then
            python -m analytics.batch.sync_rosters
          else
            python -m analytics.batch.sync_rosters --league "$LEAGUE"
          fi

      - name: NBA nightly batch (incl. reconcile)
        id: nba_nightly
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'nba') }}
        run: python -m analytics.batch.nightly --date "$(date -u +%Y-%m-%d)"

      # Insert game rows for the next 7 days so Kalshi tickers can match.
      # --slate-only skips reconcile + backfill (done above).
      - name: NBA slate sync (next 7 days)
        id: nba_slate
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'nba') }}
        run: |
          for i in 1 2 3 4 5 6 7; do
            d=$(date -u -d "+${i} days" +%Y-%m-%d)
            echo "--- Syncing slate for $d ---"
            python -m analytics.batch.nightly --slate-only --date "$d" || echo "WARN: slate sync failed for $d"
          done

      - name: Compute NBA trends
        id: nba_trends
        if: ${{ !cancelled() && (env.LEAGUE == 'all' || env.LEAGUE == 'nba') }}
        working-directory: server
        run: npm run sync-data

      # ── Freshness (read-only). Fails the job if an in-season league is stale
      # (>2d since last final box score); the off-season never fails. ──
      - name: Freshness check
        if: ${{ !cancelled() }}
        run: |
          if [ "$LEAGUE" = "all" ]; then
            python -m analytics.batch.freshness_check
          else
            python -m analytics.batch.freshness_check --league "$LEAGUE"
          fi

      # Decide which leagues' picks may run: a league's core data steps must have
      # succeeded (or been skipped by the league filter). NFL/NHL do not gate picks.
      - name: Gate picks
        id: gate
        if: ${{ !cancelled() }}
        env:
          MLB_OUT: ${{ steps.mlb_init.outcome }}|${{ steps.mlb_nightly.outcome }}|${{ steps.mlb_enrich.outcome }}|${{ steps.mlb_trends.outcome }}
          NBA_OUT: ${{ steps.nba_nightly.outcome }}|${{ steps.nba_slate.outcome }}|${{ steps.nba_trends.outcome }}
        run: |
          ok() { case "$1" in *failure*|*cancelled*) echo false;; *) echo true;; esac; }
          echo "mlb_ok=$(ok "$MLB_OUT")" >> "$GITHUB_OUTPUT"
          echo "nba_ok=$(ok "$NBA_OUT")" >> "$GITHUB_OUTPUT"

  picks:
    name: Generate picks (MLB + NBA)
    needs: data
    # Run even when the data job went red (e.g. NFL ingest or freshness failed);
    # per-league gating below decides whether each league's picks may run.
    if: ${{ !cancelled() && needs.data.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    concurrency:
      group: mlb-nightly
      cancel-in-progress: false

    env:
      LEAGUE: ${{ github.event.inputs.league || 'all' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_PRIVATE_KEY_PATH: ./kalshi_key.pem
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r analytics/requirements.txt

      - name: Write Kalshi PEM key
        run: printf '%s' "$KEY" > server/kalshi_key.pem
        env:
          KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}

      # Kalshi MLB lines + backtest + store picks for games whose markets are
      # already open (the hourly self-heal captures the rest as they list).
      - name: Generate MLB picks
        if: ${{ !cancelled() && needs.data.outputs.mlb_ok == 'true' && (env.LEAGUE == 'all' || env.LEAGUE == 'mlb') }}
        run: python -m analytics.picks.generate_mlb --today ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # Kalshi NBA lines + backtest + store picks.
      - name: Generate NBA picks
        if: ${{ !cancelled() && needs.data.outputs.nba_ok == 'true' && (env.LEAGUE == 'all' || env.LEAGUE == 'nba') }}
        run: python -m analytics.picks.generate --date "$(date -u +%Y-%m-%d)"
