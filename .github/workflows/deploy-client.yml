name: Deploy Client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-client.yml'
  workflow_dispatch:

concurrency:
  group: deploy-client
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      # tsconfig.app.json only covers src/, so the Pages Function — which holds
      # the API's shared secret — needs its own Workers-runtime typecheck.
      - name: Typecheck Pages Function
        working-directory: client
        run: npm run typecheck:functions

      - name: Test
        working-directory: client
        run: npm test

      # No VITE_API_BASE_URL: the client calls same-origin /api, which the Pages
      # Function in client/functions/api/ proxies to Lambda. Setting it would
      # send the browser cross-origin and reintroduce CORS.
      - name: Build
        working-directory: client
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          # The functions/ directory is picked up automatically from
          # workingDirectory and deployed alongside the static assets.
          command: pages deploy dist --project-name=stattraksports --branch=main
