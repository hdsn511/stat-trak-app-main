name: Nightly MLB Pipeline

# Runs after the prior night's games are final (for reconcile) and then spans the
# day. Unlike the NBA pipeline, statsapi.mlb.com is NOT IP-blocked from GitHub
# Actions, so this runs cleanly with no proxy.
#
# ADDITIVE-LOCK across the day: Kalshi opens MLB markets PER-GAME close to each
# game's first pitch, so any single run sees only the games nearest their start
# (~5 pitchers). generate_mlb freezes each pick at first creation and every firing
# only ADDS picks for markets that newly opened (see _store_picks), so the 4 runs
# progressively capture the full day's slate (day games by late morning, night /
# west-coast games by evening) with no churn and no duplicate stacking. Spacing
# the runs from late morning to evening is what gives full pitcher coverage.
#
# Scheduled runs are often delayed or silently SKIPPED under load; the multiple
# firings + concurrency guard absorb that, and additive-lock makes any overlap
# harmless. The non-pick steps (reconcile, box scores, slate/lineup sync, enrich,
# trends) run every firing. Manual --force does a full rebuild of the day.
on:
  schedule:
    - cron: '0 15 * * *'   # 11:00 ET — day-game lineups/markets posting
    - cron: '0 18 * * *'   # 14:00 ET — adds early evening games
    - cron: '0 21 * * *'   # 17:00 ET — adds night-game markets
    - cron: '0 23 * * *'   # 19:00 ET — adds late / west-coast game markets
  workflow_dispatch:

concurrency:
  group: mlb-nightly
  cancel-in-progress: false

jobs:
  pipeline:
    name: Nightly MLB Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_PRIVATE_KEY_PATH: ./kalshi_key.pem
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r analytics/requirements.txt
          npm ci --prefix server

      - name: Write Kalshi PEM key
        run: printf '%s' "$KEY" > server/kalshi_key.pem
        env:
          KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}

      # Refresh teams + active rosters (idempotent upserts; picks up call-ups).
      - name: Refresh MLB rosters
        run: python -m analytics.batch.mlb_init

      # Reconcile yesterday's picks, backfill missed box scores, sync today's
      # slate + probable starters, compute daily_conditions.
      - name: MLB nightly batch
        run: python -m analytics.batch.mlb_nightly --today

      # Empirical park factors + pitcher quality snapshots.
      - name: MLB enrich
        run: python -m analytics.batch.mlb_enrich

      # Recompute z-score trends.
      - name: Compute MLB trends
        working-directory: server
        run: npm run sync-data-mlb

      # Fetch Kalshi MLB lines + backtest + store picks.
      - name: Generate MLB picks
        run: python -m analytics.picks.generate_mlb --today
