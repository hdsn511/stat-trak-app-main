name: Nightly MLB Pipeline

# RUNS ONCE PER DAY. Reconciles the prior night's picks, backfills box scores,
# refreshes rosters, syncs today's slate (incl. per-game first-pitch time) +
# probable starters, enriches, recomputes trends, and generates picks for any
# games whose Kalshi markets are already open by late morning (mostly day games).
# Unlike the NBA pipeline, statsapi.mlb.com is NOT IP-blocked from Actions.
#
# The rest of the slate is captured by the SEPARATE hourly pre-game self-heal
# (.github/workflows/mlb-selfheal-picks.yml), which is picks-only: Kalshi opens
# MLB markets PER-GAME close to first pitch, so night / west-coast games have no
# markets yet at this daily run. The self-heal re-runs generate_mlb hourly and
# additive-lock (see generate_mlb._store_picks) adds only markets that newly
# opened, for games that have NOT yet started. The old design fired the FULL
# pipeline 4x/day, which let later runs stack picks off in-progress (live) games
# once Kalshi's in-play markets opened — the live gate + this split removes that.
#
# Manual --force (via workflow_dispatch input) rebuilds the day's ungraded picks.
on:
  schedule:
    - cron: '0 15 * * *'   # 11:00 ET — after overnight games are final; day-game markets posting
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild today''s ungraded picks (--force)'
        type: boolean
        default: false

concurrency:
  group: mlb-nightly
  cancel-in-progress: false

jobs:
  pipeline:
    name: Nightly MLB Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_PRIVATE_KEY_PATH: ./kalshi_key.pem
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r analytics/requirements.txt
          npm ci --prefix server

      - name: Write Kalshi PEM key
        run: printf '%s' "$KEY" > server/kalshi_key.pem
        env:
          KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}

      # Refresh teams + active rosters (idempotent upserts; picks up call-ups).
      - name: Refresh MLB rosters
        run: python -m analytics.batch.mlb_init

      # Reconcile yesterday's picks, backfill missed box scores, sync today's
      # slate + probable starters, compute daily_conditions.
      - name: MLB nightly batch
        run: python -m analytics.batch.mlb_nightly --today

      # Empirical park factors + pitcher quality snapshots.
      - name: MLB enrich
        run: python -m analytics.batch.mlb_enrich

      # Recompute z-score trends.
      - name: Compute MLB trends
        working-directory: server
        run: npm run sync-data-mlb

      # Fetch Kalshi MLB lines + backtest + store picks for games whose markets
      # are already open (the hourly self-heal captures the rest as they list).
      - name: Generate MLB picks
        run: python -m analytics.picks.generate_mlb --today ${{ github.event.inputs.force == 'true' && '--force' || '' }}
