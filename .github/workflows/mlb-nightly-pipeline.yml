name: Nightly MLB Pipeline

# Runs every morning at 7:00am ET (11:00 UTC during EDT) — after the prior
# night's games are final. Unlike the NBA pipeline, statsapi.mlb.com is NOT
# IP-blocked from GitHub Actions, so this runs cleanly with no proxy.
#
# GitHub's scheduled runs are frequently delayed or silently SKIPPED under load
# (observed several-hour delays and at least one no-show). The whole pipeline is
# idempotent: daily_lines and pick_results are SNAPSHOT-REPLACED per date+league
# (generate_mlb._store_daily_lines / _store_picks), so each firing fully replaces
# today's slate rather than accumulating. We fire multiple times and let the
# concurrency guard serialise them — any one firing produces today's slate +
# picks, and the latest firing is the canonical slate (refreshed against the
# newest Kalshi lines + confirmed lineups). An empty run is a no-op, so a late
# firing after games start never wipes a good slate.
on:
  schedule:
    - cron: '0 11 * * *'   # primary  (07:00 ET)
    - cron: '0 15 * * *'   # backup   (11:00 ET) — covers a skipped/delayed 11:00
    - cron: '0 19 * * *'   # backup   (15:00 ET)
  workflow_dispatch:

concurrency:
  group: mlb-nightly
  cancel-in-progress: false

jobs:
  pipeline:
    name: Nightly MLB Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_PRIVATE_KEY_PATH: ./kalshi_key.pem
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r analytics/requirements.txt
          npm ci --prefix server

      - name: Write Kalshi PEM key
        run: printf '%s' "$KEY" > server/kalshi_key.pem
        env:
          KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}

      # Refresh teams + active rosters (idempotent upserts; picks up call-ups).
      - name: Refresh MLB rosters
        run: python -m analytics.batch.mlb_init

      # Reconcile yesterday's picks, backfill missed box scores, sync today's
      # slate + probable starters, compute daily_conditions.
      - name: MLB nightly batch
        run: python -m analytics.batch.mlb_nightly --today

      # Empirical park factors + pitcher quality snapshots.
      - name: MLB enrich
        run: python -m analytics.batch.mlb_enrich

      # Recompute z-score trends.
      - name: Compute MLB trends
        working-directory: server
        run: npm run sync-data-mlb

      # Fetch Kalshi MLB lines + backtest + store picks.
      - name: Generate MLB picks
        run: python -m analytics.picks.generate_mlb --today
