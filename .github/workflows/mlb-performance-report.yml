name: MLB Performance Report

# Forward performance + calibration tracker. Runs daily after the reconcile job
# (16:00 UTC) so the prior day's picks are settled, then prints the report to the
# Actions log: model record vs market break-even, calibration gap, pick volume,
# and box-score ingestion health.
on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  report:
    name: MLB Performance + Calibration Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install Python deps
        run: pip install -r analytics/requirements.txt

      - name: Run performance report
        run: python -m analytics.batch.mlb_performance_report --windows 7 30
