name: Reconcile MLB Picks

# Runs at noon ET (16:00 UTC during EDT) to resolve yesterday's MLB picks once
# the prior night's box scores are in the DB. Mirrors the NBA reconcile job.
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  reconcile:
    name: Reconcile Yesterday's MLB Picks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install Python deps
        run: pip install -r analytics/requirements.txt

      # --reconcile-only fills actual_result + did_hit for yesterday's MLB picks.
      - name: Reconcile MLB picks
        run: python -m analytics.batch.mlb_nightly --reconcile-only --today
