name: Nightly NBA Pipeline

# DISABLED INDEFINITELY (2026-06-24). statsapi/nba endpoints are IP-blocked from
# GitHub-hosted runners (see memory: nba-pipeline-ip-block), so every scheduled
# run hung for the full 120-min timeout and was cancelled with zero output —
# burning ~2400 GitHub Actions minutes/month (the bulk of the 3000-min budget)
# for nothing. The schedule is removed; only manual dispatch remains so it can be
# re-enabled IF the data fetch is ever proxied/unblocked. Re-add the cron then.
on:
  workflow_dispatch:

jobs:
  pipeline:
    name: Nightly Pipeline
    runs-on: ubuntu-latest
    # Safety net: cap any accidental manual run so an IP-block hang can't burn 2h.
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_PRIVATE_KEY_PATH: ./kalshi_key.pem
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r analytics/requirements.txt
          npm ci --prefix server

      - name: Write Kalshi PEM key
        run: printf '%s' "$KEY" > server/kalshi_key.pem
        env:
          KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}

      # Step 1 — backfill any missed dates + fetch today's box scores + compute daily_conditions
      - name: Nightly batch
        run: python -m analytics.batch.nightly --date "$(date -u +%Y-%m-%d)"

      # Step 2 — insert game rows for the next 7 days so Kalshi tickers can match.
      # --slate-only skips reconcile + backfill (already done above); only syncs
      # the game slate and computes daily_conditions for each future date.
      - name: Slate sync (next 7 days)
        run: |
          for i in 1 2 3 4 5 6 7; do
            d=$(date -u -d "+${i} days" +%Y-%m-%d)
            echo "--- Syncing slate for $d ---"
            python -m analytics.batch.nightly --slate-only --date "$d" || echo "WARN: slate sync failed for $d"
          done

      # Step 3 — recompute z-scores and rolling averages with fresh stats
      - name: Compute NBA trends
        working-directory: server
        run: npm run sync-data

      # Step 4 — fetch Kalshi lines + backtest + store picks
      - name: Generate picks
        run: python -m analytics.picks.generate --date "$(date -u +%Y-%m-%d)"
