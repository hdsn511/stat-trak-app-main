AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: StatTrak API — Express on Lambda behind a Function URL, fronted by Cloudflare Pages.

Parameters:
  SupabaseUrl:
    Type: String
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
  SportqueryDbUrl:
    Type: String
    NoEcho: true
    Description: >-
      Supavisor TRANSACTION-mode pooler URL, port 6543 — not the direct 5432
      connection. Direct connections from a scaling Lambda exhaust Postgres.
  GroqApiKey:
    Type: String
    NoEcho: true
  UpstashRedisRestUrl:
    Type: String
    Default: ''
  UpstashRedisRestToken:
    Type: String
    NoEcho: true
    Default: ''
  ApiSharedSecret:
    Type: String
    NoEcho: true
    Description: >-
      Shared secret the Cloudflare Pages Function injects. The function fails
      closed without it, since a Function URL is publicly addressable.
  AllowedOrigins:
    Type: String
    Default: ''
    Description: >-
      Comma-separated CORS allowlist. Normally empty: the SPA reaches the API
      same-origin through the Pages Function, so no cross-origin access is needed.
  LogRetentionDays:
    Type: Number
    Default: 14

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    # ~20% cheaper per GB-second than x86_64.
    Architectures:
      - arm64

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ../server/build/lambda/
      # The Lambda Web Adapter layer execs this script and proxies invocations
      # to the HTTP server it starts, so the Express app needs no adapter shim.
      Handler: run.sh
      Runtime: nodejs24.x
      Layers:
        - !Sub 'arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:28'
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: 8000
          PORT: 8000
          # SportQuery answers over SSE, token by token. Both this and the
          # Function URL's InvokeMode must say stream — set either one alone and
          # the response is silently buffered until the handler returns, which
          # turns the streamed answer into one delayed dump.
          AWS_LWA_INVOKE_MODE: response_stream
          # Delays traffic until Express is actually listening.
          READINESS_CHECK_PATH: /health
          NODE_ENV: production
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          SPORTQUERY_DB_URL: !Ref SportqueryDbUrl
          GROQ_API_KEY: !Ref GroqApiKey
          UPSTASH_REDIS_REST_URL: !Ref UpstashRedisRestUrl
          UPSTASH_REDIS_REST_TOKEN: !Ref UpstashRedisRestToken
          API_SHARED_SECRET: !Ref ApiSharedSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      FunctionUrlConfig:
        # NONE is the only option for a public API. The Pages Function's shared
        # secret, checked in middleware/proxySecret.ts, is what actually keeps
        # unauthenticated callers off endpoints that bill per request.
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # Declared explicitly so retention is bounded; the implicitly created group
  # defaults to never expiring, which quietly accrues CloudWatch cost.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  FunctionUrl:
    Description: Set this as API_ORIGIN on the Cloudflare Pages project.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref ApiFunction
